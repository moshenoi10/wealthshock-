name: CI and Render Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Python static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Render dependencies
        run: pip install -r requirements.txt

      - name: Install GHA dependencies
        run: pip install -r requirements_gha.txt

      - name: Compile Python sources
        run: python -m py_compile main.py video_processor.py auto_heal.py

  deploy:
    name: Trigger Render deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Validate Render deployment secrets
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ] || [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "Render deploy secrets are missing. Skipping deploy step."
            exit 0
          fi

      - name: Trigger Render deploy
        run: |
          response=$(curl -s -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}')
          http_code=${response: -3}
          body=${response:: -3}
          echo "Render deploy HTTP code: $http_code"
          echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "Render deploy failed"
            exit 1
          fi

name: Process Video

# Triggered by Render after script + audio are ready.
# Remotion (React/TypeScript) handles all video effects.
# ffmpeg is still required for ffprobe (audio duration detection).
on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct download URL for the gTTS MP3 voiceover'
        required: true
        type: string
      stock_video_urls:
        description: 'JSON array of Pixabay finance/money video URLs (15-20)'
        required: true
        type: string
      title:
        description: 'Video title'
        required: true
        type: string
      script:
        description: 'Script text for word-synced captions'
        required: true
        type: string

jobs:
  render:
    name: Render Shorts with Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── System deps ──────────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-color-emoji \
            libgbm-dev \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libxss1 \
            libxtst6
          # libasound2 was renamed in Ubuntu 24.04
          sudo apt-get install -y libasound2 2>/dev/null \
            || sudo apt-get install -y libasound2t64 2>/dev/null \
            || true

      # ── Node.js + Remotion ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Remotion node_modules
        uses: actions/cache@v4
        with:
          path: remotion/node_modules
          key: remotion-${{ hashFiles('remotion/package.json') }}
          restore-keys: remotion-

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install

      # ── Python + video_processor ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements_gha.txt

      - name: Render video
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
          STOCK_VIDEO_URLS: ${{ inputs.stock_video_urls }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
        run: python video_processor.py

      # ── Artifact ─────────────────────────────────────────────────────────────
      - name: Upload finished MP4 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4
          retention-days: 1
          if-no-files-found: error
